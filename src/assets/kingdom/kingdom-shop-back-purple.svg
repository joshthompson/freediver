<svg xmlns="http://www.w3.org/2000/svg" width="200" height="190" viewBox="0 0 200 190"><defs>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6E452C"/><stop offset="0.5" stop-color="#9A6640"/><stop offset="1" stop-color="#6E452C"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FBE7A1"/><stop offset="0.5" stop-color="#E8B84A"/><stop offset="1" stop-color="#B07A26"/>
  </linearGradient>
</defs>
<!-- Posts -->
<rect x="10" y="30" width="11" height="160" rx="3" fill="url(#wood)"/>
<rect x="179" y="30" width="11" height="160" rx="3" fill="url(#wood)"/>
<!-- Back wall of the stall, in shadow -->
<rect x="21" y="52" width="158" height="138" fill="#1F3A40" opacity="0.55"/>
<!-- An empty shelf -->
<rect x="30" y="92" width="140" height="6" rx="2" fill="#7A4E31"/>
<rect x="36" y="98" width="5" height="10" fill="#5C3A24"/>
<rect x="159" y="98" width="5" height="10" fill="#5C3A24"/>
<!-- Striped awning with a scalloped edge, red and cream like the banners -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 1.2;0 0" dur="4s" repeatCount="indefinite"/>
  <path d="M4,22 H196 L192,48 H8 Z" fill="#F3E3C3"/>
  <path d="M28,22 H52 L51,48 H31 Z M76,22 H100 L100,48 H79 Z M124,22 H148 L147,48 H125 Z M172,22 H196 L192,48 H173 Z" fill="#7A3FB0"/>
  <path d="M4,22 H28 L31,48 H8 Z M52,22 H76 L79,48 H51 Z M100,22 H124 L125,48 H100 Z M148,22 H172 L173,48 H147 Z" fill="#F3E3C3"/>
  <path d="M8,48 a5.8,6 0 0 0 23,0 a5.8,6 0 0 0 20,0 a5.8,6 0 0 0 28,0 a5.8,6 0 0 0 21,0 a5.8,6 0 0 0 25,0 a5.8,6 0 0 0 22,0 a5.8,6 0 0 0 26,0 a5.8,6 0 0 0 19,0 Z" fill="#7A3FB0"/>
  <rect x="2" y="16" width="196" height="8" rx="4" fill="url(#gold)" stroke="#8A5A1C" stroke-width="1"/>
</g>
<!-- A sign with a bone on it, swinging gently under the awning -->
<g>
  <animateTransform attributeName="transform" type="rotate" values="-4 100 56;4 100 56;-4 100 56" dur="3.2s" repeatCount="indefinite"/>
  <path d="M88,56 V66 M112,56 V66" stroke="#8A5A1C" stroke-width="1.6"/>
  <rect x="78" y="64" width="44" height="22" rx="4" fill="#9A6640" stroke="#5C3A24" stroke-width="1.5"/>
  <path d="M90,72 a3.2,3.2 0 1 1 3.5,2.5 H106.5 a3.2,3.2 0 1 1 3.5,-2.5 a3.2,3.2 0 1 1 0,6 a3.2,3.2 0 1 1 -3.5,-2.5 H93.5 a3.2,3.2 0 1 1 -3.5,2.5 a3.2,3.2 0 1 1 0,-6 Z" fill="#F3E3C3"/>
</g>
</svg>
